name: CI

on:
  push:
  pull_request:

# Un push nuevo a la misma rama cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Solo lectura: el CI no escribe en el repo ni publica nada.
permissions:
  contents: read

jobs:
  app:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions fijadas por SHA de commit (el comentario dice la versión).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # El build no necesita variables de Supabase: se validan al arrancar.
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  base-de-datos:
    name: Migraciones y tests RLS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Solo Postgres (no Auth, Storage, Studio…): aplica todas las migraciones.
      - run: npx supabase db start
      - run: npm run test:db
      - name: Los tipos de src/types/base-datos.ts están al día
        run: |
          npm run db:tipos
          git diff --exit-code src/types/base-datos.ts || {
            echo "::error::Las migraciones cambiaron y los tipos no. Corre 'npm run db:tipos' y haz commit."
            exit 1
          }
